name: Desktop apps

# Builds the desktop applications (Tauri) for macOS, Windows and Linux and attaches them to the
# release for the tag being built -- the same release the backend binaries go to (release.yml).
#
# WHICH SERVER THE APP TALKS TO. The packaged app asks on first launch and keeps the answer
# (frontend/src/apiBase.ts), so one published binary serves everybody who runs their own instance.
# The repository variable DESKTOP_API_BASE is optional: when set it only pre-fills that field, which
# is what an organisation building its own copy would want. Releases here leave it empty.
#
# NOT SIGNED. No Apple Developer ID and no Windows Authenticode certificate is configured, so macOS
# reports an unidentified developer and Windows shows a SmartScreen warning. That is stated on the
# download page rather than left for the user to discover; adding certificates later means adding
# the secrets tauri-action already reads, not rewriting this file.

on:
  push:
    tags: ["v*"]
  # Building without publishing, to check the three platforms still compile.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: a broken Windows toolchain should still
      # leave macOS and Linux artifacts on the release.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple silicon)
            target: aarch64-apple-darwin
          - os: macos-13
            label: macOS (Intel)
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            label: Linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cargo's registry and the target directory, keyed per platform. A cold Tauri build is minutes
      # of dependency compilation that does not change between releases.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev build-essential curl wget file

      # --legacy-peer-deps: the same flag make deps and CI use; unresolved peer ranges among the
      # editor and media libraries make a plain npm ci fail outright.
      - run: npm ci --legacy-peer-deps
        working-directory: frontend

      - uses: tauri-apps/tauri-action@v0
        env:
          # Only the default offered in the first-launch field; empty here on purpose, so the
          # published build asks rather than arriving pointed at somebody else's instance.
          VITE_API_BASE: ${{ vars.DESKTOP_API_BASE }}
          VITE_PUBLIC_BASE: ${{ vars.DESKTOP_API_BASE }}
        with:
          projectPath: frontend
          args: --target ${{ matrix.target }}

      # Stable file names, so the download page can link to
      # releases/latest/download/<name> and never be edited again for a version bump. Tauri's own
      # names carry the version, which would make every link stale on the next release.
      - name: Rename for a stable download URL
        id: rename
        shell: bash
        run: |
          set -euo pipefail
          out="frontend/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist-release
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)  find "$out" -name '*.dmg'      -exec cp {} dist-release/Beskos-macos-apple-silicon.dmg \; ;;
            x86_64-apple-darwin)   find "$out" -name '*.dmg'      -exec cp {} dist-release/Beskos-macos-intel.dmg \; ;;
            x86_64-pc-windows-msvc)
              find "$out" -name '*.msi'      -exec cp {} dist-release/Beskos-windows-x64.msi \; || true
              find "$out" -name '*-setup.exe' -exec cp {} dist-release/Beskos-windows-x64-setup.exe \; || true ;;
            x86_64-unknown-linux-gnu)
              find "$out" -name '*.AppImage' -exec cp {} dist-release/Beskos-linux-x86_64.AppImage \; || true
              find "$out" -name '*.deb'      -exec cp {} dist-release/Beskos-linux-amd64.deb \; || true ;;
          esac
          ls -la dist-release

      # The same tag starts release.yml, and that is what CREATES the release. Uploading before it
      # exists fails outright, and the four platform jobs would fail together -- the desktop build
      # is the slower of the two, but not reliably so.
      - name: Wait for the release to exist
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              echo "release ${{ github.ref_name }} is there"; exit 0
            fi
            echo "waiting for release ${{ github.ref_name }} ($i/60)"; sleep 20
          done
          echo "::error::release ${{ github.ref_name }} never appeared; did release.yml fail?"
          exit 1

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist-release/* --clobber

      # On a manual run there is no release to attach to; keep the artifacts so the build can be
      # checked without tagging anything.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: desktop-${{ matrix.target }}
          path: dist-release/*
