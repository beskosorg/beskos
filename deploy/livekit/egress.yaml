# LiveKit Egress — records meetings (RoomComposite) and uploads the MP4 to MinIO (S3). Coordinates
# with LiveKit via Redis. S3 config is passed per-request (endpoint minio:9000). Dev: insecure.
redis:
  address: redis:6379
api_key: devkey
api_secret: devsecret_livekit_change_me_0123456789
ws_url: ws://127.0.0.1:7880
insecure: true
log_level: info
