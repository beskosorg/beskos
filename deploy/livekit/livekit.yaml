# LiveKit server — local dev. In production: TLS/proxy, TURN, and real IPs/ports.
# node_ip 127.0.0.1 makes the server announce ICE candidates reachable by the browser on the same
# machine (Docker Desktop forwards the published ports). A single UDP port simplifies publishing.
port: 7880
# Redis: coordinates Egress (recording). Without it, recording is unavailable.
redis:
  address: redis:6379
# Room closes ~2min after becoming empty → the meeting turns "ended" and the duration is computed.
room:
  empty_timeout: 120
  departure_timeout: 20
rtc:
  tcp_port: 7881
  port_range_start: 7882
  port_range_end: 7882
  use_external_ip: false
  node_ip: 127.0.0.1
keys:
  devkey: devsecret_livekit_change_me_0123456789
# Server-to-server webhooks → our API (real times/presence). api_key must exist in keys.
webhook:
  api_key: devkey
  urls:
    - http://api:8000/meet/webhook
logging:
  level: info
