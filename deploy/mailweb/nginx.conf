# mail.beskos.com -- the mail server's own hostname, over HTTPS.
#
# Why it exists: port 443 on this machine belongs to CapRover's own nginx, which didn't know
# about `mail.beskos.com` and served its default self-signed certificate. Anyone pointing
# Thunderbird or a JMAP client at this name hit a certificate warning. Now there's an app
# (`mail`) that claims the name and gets a Let's Encrypt certificate like every other app.
#
# What it does NOT do: expose Stalwart's HTTP port. That port (8080) is bound to localhost on
# purpose -- it carries the admin API, with credentials that reach every mailbox. Only the
# discovery paths pass through here, and they go through the same place the webmail already
# serves them from.

server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 valid=30s ipv6=off;
  # The webmail container, which already knows how to forward these paths to the Go API and
  # from there to Stalwart. One extra hop, zero new surface.
  set $web "srv-captain--app";

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Autodiscovery: this is what a mail client looks up the server name for.
  #   /.well-known/jmap            JMAP session (RFC 8620)
  #   /.well-known/caldav|carddav  calendar and contacts
  #   /.well-known/acme-challenge  certificate validation
  location /.well-known/ { proxy_pass http://$web; }
  location /jmap         { proxy_pass http://$web; }

  # Everything else goes to the application. Someone who types "mail.beskos.com" in the browser
  # wants the mail app, not an error page. Temporary (302), not permanent: a 301 stays cached in
  # the browser forever and locks this name to this destination for the day we want to serve
  # something else here instead.
  location / { return 302 https://app.beskos.com/mail; }
}
