server {
    listen 80;
    server_name _;

    # text/plain is required by the RFC; nginx would otherwise serve .txt correctly anyway, but
    # stating it here means a future change to the file's name cannot silently break the policy.
    location = /.well-known/mta-sts.txt {
        default_type text/plain;
        alias /usr/share/nginx/html/.well-known/mta-sts.txt;
    }

    # Nothing else lives here. A policy host that answers other paths invites somebody to point
    # something at it later.
    location / {
        return 404;
    }
}
