server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Only the overlay network reaches this. It is not published outside the swarm, and an open
    # recursive resolver on the public internet is an amplification weapon.
    access-control: 0.0.0.0/0 refuse
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: 127.0.0.0/8 allow

    root-hints: "/var/lib/unbound/root.hints"

    # Recursion, not forwarding: that is the whole point. A forward-zone here would put us back
    # behind somebody else's resolver and the blocklists would refuse us again.
    harden-glue: yes
    harden-dnssec-stripped: yes
    prefetch: yes
    cache-min-ttl: 60
    cache-max-ttl: 3600

    # A "does not exist" is cached for the zone's SOA minimum, and plenty of providers publish a
    # whole day there -- Bunny does. Left alone, that is how long we keep telling a customer their
    # records are missing AFTER they published them: the worker asked once too early, and the answer
    # it got outlives the working day.
    cache-max-negative-ttl: 60

    # The audit is bursty -- one visitor triggers a dozen lookups at once.
    num-threads: 2
    so-reuseport: yes

    verbosity: 0
    logfile: ""
    use-syslog: no
    chroot: ""
    username: ""
    directory: "/var/lib/unbound"
    pidfile: "/tmp/unbound.pid"
