# Served by the webmail container. Static files + same-origin proxy to the Go API.
# ${API_UPSTREAM} is substituted at startup (envsubst from the nginx image); nginx's own $vars stay.

# WebSocket Connection header (upgrade when there is an Upgrade, otherwise close).
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker/Swarm internal DNS — resolves the API service at runtime (doesn't fail if it comes up later).
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api "${API_UPSTREAM}";

  client_max_body_size 2g;   # large attachments go through the API before heading to R2

  # WebSocket/SSE headers (JMAP push + chat).
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600s;   # long-lived SSE

  location /api/          { proxy_pass http://$api; }
  location /jmap          { proxy_pass http://$api; }
  location /auth/         { proxy_pass http://$api; }
  location /.well-known/  { proxy_pass http://$api; }
  # Root routes (outside /api) served by the Go API: LiveKit webhook (server-to-server),
  # OnlyOffice callbacks/AI. The SPA doesn't use these paths, so it's safe to forward them.
  location /meet/         { proxy_pass http://$api; }
  location /doc/          { proxy_pass http://$api; }
  location = /v1/chat/completions { proxy_pass http://$api; }
  location = /v1/models           { proxy_pass http://$api; }

  # .mjs does NOT exist in this nginx image's mime.types: it was served as application/octet-stream
  # and the browser REFUSES to load an ES module with the wrong MIME type (strict MIME type
  # checking). pdf.js's worker is a .mjs — without this no presentation opened on the web
  # ("could not load presentation").
  # Regex location because a `types` block here would replace the whole map, breaking css/fonts.
  location ~* \.mjs$ {
    default_type text/javascript;
    expires 1y; add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Hashed assets → long cache. Everything else falls to the SPA (client-side routing).
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
