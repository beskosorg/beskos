[package]
name = "beskos-sync"
version = "0.1.0"
edition = "2021"
description = "Motor de sincronização de ficheiros do Beskos, embutido na app desktop."
license = "MIT"

# Library only: the ENGINE. Whoever hosts it (window, tray, menus) is the desktop app.
[lib]
name = "beskos_sync"
path = "src/lib.rs"


[dependencies]
# HTTP with TLS via rustls (no dependency on the system's OpenSSL -- portable).
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local index: bundled SQLite -- does not require a system SQLite.
rusqlite = { version = "0.31", features = ["bundled"] }
# Content hash: SHA-256, the SAME algorithm the server uses (ETag), to detect local changes.
sha2 = "0.10"
anyhow = "1"
# Filesystem watcher (FSEvents on macOS, inotify on Linux): syncs almost immediately instead of
# waiting for the polling interval.
notify = "8"

[profile.release]
strip = true
opt-level = "z"
lto = true
